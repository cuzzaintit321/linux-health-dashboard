<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux Health Dashboard</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e7edf7;background:#0b1020}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:50px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{letter-spacing:2px;font-size:12px;color:#6ee7c8;font-weight:700}h1{font-size:clamp(26px,4vw,40px);margin:12px 0}p,.muted{color:#9daec5}button{background:#1b2943;border:1px solid #3d5276;color:#e7edf7;padding:12px 18px;border-radius:9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0}.card,section{background:#121b2d;border:1px solid #27344c;border-radius:14px;padding:24px}.value{font-size:38px;font-weight:650;margin:12px 0}progress{width:100%;height:9px;accent-color:#6ee7c8}section{margin:18px 0}h2{font-size:18px;margin-top:0}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #27344c;padding:13px 8px;overflow-wrap:anywhere;font-size:14px}.table-wrap{overflow-x:auto}th{color:#9daec5;font-weight:500}.tag{padding:5px 9px;background:#1e3a35;color:#91ead3;border-radius:6px}.warning{background:#49341f;color:#ffcc8b}.hidden{display:none}#error{padding:14px;border:1px solid #885842;border-radius:8px;color:#ffd1ae}@media(max-width:650px){.grid{grid-template-columns:1fr}header{align-items:flex-start}main{margin-top:26px}.value{font-size:32px}}
</style>
<main><header><div><div class="eyebrow">SYSTEMS / OBSERVABILITY</div><h1>Linux Health Dashboard</h1><p>Read-only visibility into your machine.</p></div><button id="refresh">Refresh</button></header>
<p id="mode" class="muted"></p><p id="error" class="hidden" role="alert"></p>
<div class="grid"><div class="card"><span class="muted">Memory used</span><div class="value" id="mem">—</div><progress id="mem-bar" max="100" value="0"></progress><p id="mem-detail">Waiting for metrics</p></div><div class="card"><span class="muted">Disk used</span><div class="value" id="disk">—</div><progress id="disk-bar" max="100" value="0"></progress><p id="disk-detail">Waiting for metrics</p></div><div class="card"><span class="muted">System uptime</span><div class="value" id="uptime">—</div><p id="load">Waiting for metrics</p><p class="muted">Load average: 1 / 5 / 15 minutes</p></div></div>
<section><h2>Systemd services</h2><div id="services" class="table-wrap"></div></section><section><h2>Docker containers</h2><div id="containers" class="table-wrap"></div></section><p id="updated" class="muted" aria-live="polite">Connecting…</p></main>
<script>
const el=id=>document.getElementById(id);const gib=n=>(n/1024**3).toFixed(1)+' GiB';
function table(target,headers,rows){const box=el(target);box.replaceChildren();if(!rows.length){box.textContent='No items configured or found.';return}const t=document.createElement('table');const head=t.createTHead().insertRow();headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;head.append(th)});const body=t.createTBody();rows.forEach(row=>{const tr=body.insertRow();row.forEach(v=>{tr.insertCell().textContent=String(v)})});box.append(t)}
let pending=false;
async function refresh(){if(pending)return;pending=true;el('refresh').disabled=true;try{const r=await fetch('/api/health');const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Collector unavailable');el('error').classList.add('hidden');el('mode').textContent=d.demo?'DEMO MODE · illustrative metrics':'LIVE · localhost only · updates every 15 seconds';if(d.memory){el('mem').textContent=d.memory.percent+'%';el('mem-bar').value=d.memory.percent;el('mem-detail').textContent=gib(d.memory.used)+' of '+gib(d.memory.total)}else{el('mem').textContent='N/A';el('mem-detail').textContent='Linux /proc data unavailable'}el('disk').textContent=d.disk.percent+'%';el('disk-bar').value=d.disk.percent;el('disk-detail').textContent=gib(d.disk.used)+' of '+gib(d.disk.total)+' · '+d.disk.path;el('uptime').textContent=d.uptime_seconds===null?'N/A':Math.floor(d.uptime_seconds/86400)+'d '+Math.floor(d.uptime_seconds%86400/3600)+'h';el('load').textContent=d.load?d.load.map(n=>n.toFixed(2)).join(' / ')+' · '+d.cpu_count+' CPUs':'Load unavailable';table('services',['Service','State'],d.services.map(s=>[s.name,s.state]));table('containers',['Container','Image','State','Status'],d.containers.items.map(c=>[c.name,c.image,c.state,c.status]));if(!d.containers.available)el('containers').textContent=d.containers.note;el('updated').textContent='Captured '+new Date(d.captured_at).toLocaleString()}catch(e){el('error').textContent=e.message+' — displayed metrics may be stale.';el('error').classList.remove('hidden')}finally{pending=false;el('refresh').disabled=false}}
el('refresh').onclick=refresh;refresh();setInterval(refresh,15000);
</script></html>
